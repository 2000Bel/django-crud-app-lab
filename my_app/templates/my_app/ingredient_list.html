{% extends 'base.html' %} 
{% load static %} 
{% block head %}
<link rel="stylesheet" href="{% static 'css/ingredients/ingredient-index.css' %}" />
{% endblock %} 
{% block content %}

<section class="page-header">
  <h1>All Food Ingredients</h1>
</section>

<section class="card-container">
  {% for ingredient in ingredient_list %}
    <div class="card" style="border-color: {{ ingredient.color }}">
      <div class="card-bg" style="background-color: {{ ingredient.color }}"></div>
      <a href="{% url 'ingredient-detail' ingredient.id %}">
        <div class="card-content">
          <h2>{{ ingredient.name }}</h2>
          <p>A {{ ingredient.color }} ingredient</p>
        </div>
      </a>
    </div>
  {% endfor %}
</section>

{% endblock %}
