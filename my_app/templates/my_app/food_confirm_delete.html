{% extends 'base.html' %}  
{% load static %} 
{% block content %}

<div class="page-header">
  <h1>Delete Food?</h1>
  <img src="{% static 'images/nerd-food.svg' %}" alt="A food using a computer" />
</div>

<h2>Are you sure you want to delete {{ food.name }}?</h2>

<form action="" method="post" class="form">
  {% csrf_token %}
  <a href="{% url 'food-detail' food.id %}" class="btn secondary">Cancel</a>
  <button type="submit" class="btn danger">Yes - Delete!</button>
</form>

{% endblock %}
